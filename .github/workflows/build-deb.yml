name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: slides-timer

jobs:
  # ────────────────────────────────────────────────────────────
  # Windows exe
  # ────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --name slides-timer `
            --add-data "ui/assets;ui/assets" `
            --add-data "config.json;." `
            --add-data "didi.wav;." `
            --add-data "icon.png;." `
            --add-data "icon.ico;." `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import PySide6.QtSvg `
            --hidden-import qfluentwidgets `
            --exclude-module tkinter `
            --exclude-module customtkinter `
            --icon icon.ico `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/slides-timer.exe

  # ────────────────────────────────────────────────────────────
  # Linux deb — amd64
  # ────────────────────────────────────────────────────────────
  build-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool dpkg-dev fakeroot
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --name slides-timer \
            --add-data "ui/assets:ui/assets" \
            --add-data "config.json:." \
            --add-data "didi.wav:." \
            --add-data "icon.png:." \
            --hidden-import PySide6.QtWidgets \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtSvg \
            --hidden-import qfluentwidgets \
            --exclude-module tkinter \
            --exclude-module customtkinter \
            main.py

      - name: Build deb package
        run: |
          VERSION="1.0.0-${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-8)"
          VERSION="${VERSION}" bash scripts/build-deb.sh amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: dist/*.deb

  # ────────────────────────────────────────────────────────────
  # Linux deb — arm64
  # ────────────────────────────────────────────────────────────
  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build arm64 deb in container
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y python3 python3-pip python3-venv xdotool dpkg-dev fakeroot
          run: |
            pip3 install -r requirements.txt
            pip3 install pyinstaller
            pyinstaller \
              --onefile \
              --name slides-timer \
              --add-data "ui/assets:ui/assets" \
              --add-data "config.json:." \
              --add-data "didi.wav:." \
              --add-data "icon.png:." \
              --hidden-import PySide6.QtWidgets \
              --hidden-import PySide6.QtCore \
              --hidden-import PySide6.QtGui \
              --hidden-import PySide6.QtSvg \
              --hidden-import qfluentwidgets \
              --exclude-module tkinter \
              --exclude-module customtkinter \
              main.py
            VERSION="1.0.0-${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-8)" \
              bash scripts/build-deb.sh arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: dist/*.deb

  # ────────────────────────────────────────────────────────────
  # Release
  # ────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-amd64, build-arm64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate version
        id: ver
        run: |
          SHORT_SHA="$(echo ${{ github.sha }} | cut -c1-8)"
          VERSION="1.0.0-${{ github.run_number }}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: List release files
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Slides Timer ${{ steps.ver.outputs.version }}"
          body: |
            ## Slides Timer ${{ steps.ver.outputs.version }}

            **Commit:** `${{ github.sha }}`

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows (x64) | `slides-timer.exe` |
            | Linux (amd64) | `slides-timer_*_amd64.deb` |
            | Linux (arm64) | `slides-timer_*_arm64.deb` |

            ### Linux 安装
            ```bash
            sudo dpkg -i slides-timer_*_amd64.deb
            sudo apt-get install -f
            ```
          files: |
            artifacts/**/*.exe
            artifacts/**/*.deb
          draft: false
          prerelease: false
